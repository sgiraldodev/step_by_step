name: step-by-step
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pomodoro}
      POSTGRES_USER: ${POSTGRES_USER:-pomodoro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    container_name: step_by_step_postgres
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pomodoro}:${POSTGRES_PASSWORD:?Configura
        POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pomodoro}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3102}
      APP_TIMEZONE: America/Bogota
      APP_ORIGIN: http://localhost:${FRONTEND_PORT:-3102}
      INITIAL_SETUP_TOKEN: ${INITIAL_SETUP_TOKEN:?Configura INITIAL_SETUP_TOKEN en
        .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SESSION_COOKIE_NAME: step_by_step_session
    ports:
    - 127.0.0.1:${API_PORT:-8102}:8000
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/ready',
        timeout=3)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    container_name: step_by_step_backend
    image: step_by_step_backend:${IMAGE_TAG:-1.0.0}
  frontend:
    build: ./frontend
    ports:
    - 127.0.0.1:${FRONTEND_PORT:-3102}:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    container_name: step_by_step_frontend
    image: step_by_step_frontend:${IMAGE_TAG:-1.0.0}
  migrations:
    image: step_by_step_backend:${IMAGE_TAG:-1.0.0}
    build: ./backend
    container_name: step_by_step_migrations
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pomodoro}:${POSTGRES_PASSWORD:?Configura
        POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pomodoro}
    command:
    - alembic
    - upgrade
    - head
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
volumes:
  postgres_data:
    name: step_by_step_postgres_data
